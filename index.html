<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Cyberware Editor</title>
<style>
  body {
    background: #0a0e14;
    color: #ff3b3b;
    font-family: monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px;
    margin: 0;
  }
  h1 {
    letter-spacing: 3px;
    text-transform: uppercase;
  }
  .instructions {
    color: #888;
    margin-bottom: 30px;
    text-align: center;
  }
  .body-container {
    position: relative;
    width: 200px;
    height: 500px;
  }
  .skeleton {
    width: 100%;
    height: 100%;
    border: 1px solid #ff3b3b33;
    border-radius: 8px;
    background: repeating-linear-gradient(
      180deg,
      #0f141c,
      #0f141c 20px,
      #131924 20px,
      #131924 21px
    );
  }
  .zone {
    position: absolute;
    border: 1px dashed #ff3b3b66;
    border-radius: 6px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    transition: all 0.2s ease;
  }
  .zone:hover {
    border-color: #ff3b3b;
  }
  .zone.active {
    background: #ff3b3b33;
    box-shadow: 0 0 15px #ff3b3b88;
    border-color: #ff3b3b;
  }
  .head   { top: 10px;  left: 60px; width: 80px; height: 60px; }
  .arm-l  { top: 90px;  left: 10px; width: 40px; height: 150px; }
  .arm-r  { top: 90px;  left: 150px;width: 40px; height: 150px; }
  .torso  { top: 90px;  left: 60px; width: 80px; height: 140px; }
  .leg-l  { top: 250px; left: 60px; width: 35px; height: 220px; }
  .leg-r  { top: 250px; left: 105px;width: 35px; height: 220px; }

  .status {
    margin-top: 30px;
    font-size: 13px;
    color: #aaa;
    max-width: 300px;
    text-align: center;
  }
</style>
</head>
<body>

  <h1>Cyberware Editor</h1>
  <p class="instructions">Clique sur une zone du corps pour (dés)installer du cyberware.<br>Prototype v1 — pas encore sauvegardé entre visiteurs.</p>

  <div class="body-container">
    <div class="skeleton"></div>
    <div class="zone head"  data-name="Œil cybernétique"></div>
    <div class="zone arm-l" data-name="Bras gauche"></div>
    <div class="zone arm-r" data-name="Bras droit"></div>
    <div class="zone torso" data-name="Torse / Internal"></div>
    <div class="zone leg-l" data-name="Jambe gauche"></div>
    <div class="zone leg-r" data-name="Jambe droite"></div>
  </div>

  <div class="status" id="status">Aucun cyberware installé.</div>

  <script>
    const zones = document.querySelectorAll('.zone');
    const status = document.getElementById('status');

    zones.forEach(zone => {
      zone.addEventListener('click', () => {
        zone.classList.toggle('active');
        updateStatus();
      });
    });

    function updateStatus() {
      const active = [...zones].filter(z => z.classList.contains('active'));
      if (active.length === 0) {
        status.textContent = "Aucun cyberware installé.";
      } else {
        const names = active.map(z => z.dataset.name).join(', ');
        status.textContent = "Installé : " + names;
      }
    }
  </script>

</body>
</html>
