<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Cyberware Editor</title>
<style>
  body {
    background: #0a0e14;
    color: #ff3b3b;
    font-family: monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px;
    margin: 0;
  }
  h1 {
    letter-spacing: 3px;
    text-transform: uppercase;
  }
  .instructions {
    color: #888;
    margin-bottom: 30px;
    text-align: center;
  }
  .body-container {
    position: relative;
    width: 100%;
    max-width: 700px;
  }
  .body-container img {
    width: 100%;
    display: block;
    border-radius: 8px;
  }
  .zone {
    position: absolute;
    border: 1px dashed #ff3b3b66;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .zone:hover {
    border-color: #ff3b3b;
  }
  .zone.active {
    background: #ff3b3b33;
    box-shadow: 0 0 15px #ff3b3b88;
    border-color: #ff3b3b;
  }
  /* Positions en % pour rester proportionnel quelle que soit la taille d'affichage */
  .head   { top: 27.5%; left: 46.8%; width: 6.5%;  height: 11.8%; }
  .torso  { top: 38%;   left: 42.1%; width: 15.7%; height: 22.3%; }
  .arm-l  { top: 39.3%; left: 38.4%; width: 4.2%;  height: 26.2%; }
  .arm-r  { top: 39.3%; left: 57.9%; width: 4.2%;  height: 26.2%; }
  .leg-l  { top: 60.3%; left: 43.5%; width: 4.2%;  height: 30.1%; }
  .leg-r  { top: 60.3%; left: 51.4%; width: 4.2%;  height: 30.1%; }

  .status {
    margin-top: 30px;
    font-size: 13px;
    color: #aaa;
    max-width: 300px;
    text-align: center;
  }
</style>
</head>
<body>

  <h1>Cyberware Editor</h1>
  <p class="instructions">Clique sur une zone du corps pour (dés)installer du cyberware.<br>Prototype v1 — pas encore sauvegardé entre visiteurs.</p>

  <div class="body-container">
    <img src="skeleton.png" alt="Squelette cyberpunk">
    <div class="zone head"  data-name="Œil cybernétique"></div>
    <div class="zone torso" data-name="Torse / Internal"></div>
    <div class="zone arm-l" data-name="Bras gauche"></div>
    <div class="zone arm-r" data-name="Bras droit"></div>
    <div class="zone leg-l" data-name="Jambe gauche"></div>
    <div class="zone leg-r" data-name="Jambe droite"></div>
  </div>

  <div class="status" id="status">Aucun cyberware installé.</div>

  <script>
    const zones = document.querySelectorAll('.zone');
    const status = document.getElementById('status');

    zones.forEach(zone => {
      zone.addEventListener('click', () => {
        zone.classList.toggle('active');
        updateStatus();
      });
    });

    function updateStatus() {
      const active = [...zones].filter(z => z.classList.contains('active'));
      if (active.length === 0) {
        status.textContent = "Aucun cyberware installé.";
      } else {
        const names = active.map(z => z.dataset.name).join(', ');
        status.textContent = "Installé : " + names;
      }
    }
  </script>

</body>
</html>
